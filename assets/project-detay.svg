<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-label="Detay Sigorta — İçeriği yönet. Deneyimi geliştir."><title>Detay Sigorta — İçeriği yönet. Deneyimi geliştir.</title><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#263253"/></linearGradient><linearGradient id="floor"><stop stop-color="#638cac"/><stop offset=".5" stop-color="#e6c17b"/><stop offset="1" stop-color="#ab91c8"/></linearGradient></defs><style>
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes cruise{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,-10px)}}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(1250px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-55px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}}
@keyframes line{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes scan{0%,20%{transform:translateY(0);opacity:0}30%,70%{opacity:.6}100%{transform:translateY(135px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.08)}}
.star{animation:twinkle 5s ease-in-out infinite}.cloud{animation:drift 65s linear infinite}.ship{animation:cruise 8s ease-in-out infinite}.walker{animation:walk 38s linear infinite}.step{animation:step .65s steps(2) infinite}.ember{animation:rise 4s linear infinite}.flow{stroke-dasharray:8 18;animation:flow 9s linear infinite}.cursor{animation:blink 1.5s steps(1) infinite}.orb{animation:orb 5s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:bottom;animation:flame 1.3s steps(3) infinite}.code{transform-box:fill-box;transform-origin:left;animation:line 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.7}.scan,.ember{opacity:0}}
</style><rect x="0" y="0" width="1200" height="232" fill="#0f1529"/><rect x="0" y="231" width="1200" height="1" fill="#34435e"/><text x="43" y="89" font-family="Trebuchet MS,Arial,sans-serif" font-size="39" fill="#f0e9df" text-anchor="start">Detay Sigorta</text><text x="43" y="133" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#c3cde5" text-anchor="start">İçeriği yönet. Deneyimi geliştir.</text><text x="43" y="188" font-family="Trebuchet MS,Arial,sans-serif" font-size="21" fill="#8fcac1" text-anchor="start">Projeyi keşfet ↗</text><rect x="816" y="39" width="300" height="159" fill="#17263b"/><path d="M960 61L1019 79V122Q1019 159 960 181Q901 159 901 122V79Z" fill="#2e655f" stroke="#8fcac1" stroke-width="3"/><path class="flow" d="M960 61L1019 79V122Q1019 159 960 181Q901 159 901 122V79Z" fill="none" stroke="#e1d2a4" stroke-width="3"/><path d="M931 115L951 136L987 96" fill="none" stroke="#c8e2d2" stroke-width="8"/><g class="star" style="animation-delay:-0s"><rect x="837" y="68" width="24" height="6" fill="#8fcac1"/><rect x="1065" y="68" width="24" height="6" fill="#8fcac1"/></g><g class="star" style="animation-delay:-2s"><rect x="837" y="109" width="24" height="6" fill="#8fcac1"/><rect x="1065" y="109" width="24" height="6" fill="#8fcac1"/></g><g class="star" style="animation-delay:-4s"><rect x="837" y="150" width="24" height="6" fill="#8fcac1"/><rect x="1065" y="150" width="24" height="6" fill="#8fcac1"/></g></svg>