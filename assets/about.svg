<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Üretmeyi seven bir geliştirici. Arayüzden arka uca."><title>Üretmeyi seven bir geliştirici. Arayüzden arka uca.</title><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#263253"/></linearGradient><linearGradient id="floor"><stop stop-color="#638cac"/><stop offset=".5" stop-color="#e6c17b"/><stop offset="1" stop-color="#ab91c8"/></linearGradient></defs><style>
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes cruise{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,-10px)}}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(1250px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-55px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}}
@keyframes line{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes scan{0%,20%{transform:translateY(0);opacity:0}30%,70%{opacity:.6}100%{transform:translateY(135px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.08)}}
.star{animation:twinkle 5s ease-in-out infinite}.cloud{animation:drift 65s linear infinite}.ship{animation:cruise 8s ease-in-out infinite}.walker{animation:walk 38s linear infinite}.step{animation:step .65s steps(2) infinite}.ember{animation:rise 4s linear infinite}.flow{stroke-dasharray:8 18;animation:flow 9s linear infinite}.cursor{animation:blink 1.5s steps(1) infinite}.orb{animation:orb 5s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:bottom;animation:flame 1.3s steps(3) infinite}.code{transform-box:fill-box;transform-origin:left;animation:line 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.7}.scan,.ember{opacity:0}}
</style><rect x="0" y="0" width="1200" height="160" fill="#0f1529"/><g class="star" style="animation-delay:-0s"><rect x="98" y="83" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="314" y="128" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="777" y="34" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="948" y="137" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="59" y="141" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-5s"><rect x="905" y="105" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-6s"><rect x="1140" y="121" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-7s"><rect x="826" y="55" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-8s"><rect x="138" y="37" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-0s"><rect x="275" y="106" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="334" y="34" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="348" y="141" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="1035" y="42" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="812" y="139" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-5s"><rect x="576" y="56" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-6s"><rect x="791" y="26" width="2" height="2" fill="#e1dbf2"/></g><text x="48" y="76" font-family="Trebuchet MS,Arial,sans-serif" font-size="36" fill="#f1e8d8" text-anchor="start">Üretmeyi seven bir geliştirici.</text><text x="48" y="119" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#c3cde5" text-anchor="start">Arayüzden arka uca, projenin her adımında.</text><g class="orb"><rect x="994" y="38" width="98" height="68" fill="#65799e"/><rect x="1002" y="46" width="82" height="52" fill="#152139"/><text x="1043" y="80" font-family="Trebuchet MS,Arial,sans-serif" font-size="25" fill="#e8ca8f" text-anchor="middle">{ }</text><rect x="1035" y="106" width="16" height="16" fill="#65799e"/><rect x="1017" y="122" width="52" height="6" fill="#91a5be"/></g></svg>