<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="232" viewBox="0 0 1200 232" role="img" aria-label="Kelime Avcısı — Kelimelerle başlayan bir keşif."><title>Kelime Avcısı — Kelimelerle başlayan bir keşif.</title><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#263253"/></linearGradient><linearGradient id="floor"><stop stop-color="#638cac"/><stop offset=".5" stop-color="#e6c17b"/><stop offset="1" stop-color="#ab91c8"/></linearGradient></defs><style>
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes cruise{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,-10px)}}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(1250px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-55px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}}
@keyframes line{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes scan{0%,20%{transform:translateY(0);opacity:0}30%,70%{opacity:.6}100%{transform:translateY(135px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.08)}}
.star{animation:twinkle 5s ease-in-out infinite}.cloud{animation:drift 65s linear infinite}.ship{animation:cruise 8s ease-in-out infinite}.walker{animation:walk 38s linear infinite}.step{animation:step .65s steps(2) infinite}.ember{animation:rise 4s linear infinite}.flow{stroke-dasharray:8 18;animation:flow 9s linear infinite}.cursor{animation:blink 1.5s steps(1) infinite}.orb{animation:orb 5s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:bottom;animation:flame 1.3s steps(3) infinite}.code{transform-box:fill-box;transform-origin:left;animation:line 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.7}.scan,.ember{opacity:0}}
</style><rect x="0" y="0" width="1200" height="232" fill="#0f1529"/><rect x="0" y="231" width="1200" height="1" fill="#34435e"/><text x="43" y="89" font-family="Trebuchet MS,Arial,sans-serif" font-size="39" fill="#f0e9df" text-anchor="start">Kelime Avcısı</text><text x="43" y="133" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#c3cde5" text-anchor="start">Kelimelerle başlayan bir keşif.</text><text x="43" y="188" font-family="Trebuchet MS,Arial,sans-serif" font-size="21" fill="#eac280" text-anchor="start">Projeyi keşfet ↗</text><g class="orb" style="animation-delay:-0.0s"><rect x="805" y="32" width="76" height="68" fill="#53483d"/><rect x="809" y="36" width="68" height="60" fill="#d8ba84"/><text x="843" y="77" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">K</text></g><g class="orb" style="animation-delay:-0.7s"><rect x="897" y="32" width="76" height="68" fill="#53483d"/><rect x="901" y="36" width="68" height="60" fill="#d8ba84"/><text x="935" y="77" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">E</text></g><g class="orb" style="animation-delay:-1.4s"><rect x="989" y="32" width="76" height="68" fill="#53483d"/><rect x="993" y="36" width="68" height="60" fill="#d8ba84"/><text x="1027" y="77" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">L</text></g><g class="orb" style="animation-delay:-2.0999999999999996s"><rect x="805" y="117" width="76" height="68" fill="#53483d"/><rect x="809" y="121" width="68" height="60" fill="#d8ba84"/><text x="843" y="162" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">İ</text></g><g class="orb" style="animation-delay:-2.8s"><rect x="897" y="117" width="76" height="68" fill="#53483d"/><rect x="901" y="121" width="68" height="60" fill="#d8ba84"/><text x="935" y="162" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">M</text></g><g class="orb" style="animation-delay:-3.5s"><rect x="989" y="117" width="76" height="68" fill="#53483d"/><rect x="993" y="121" width="68" height="60" fill="#d8ba84"/><text x="1027" y="162" font-family="Trebuchet MS,Arial,sans-serif" font-size="33" fill="#1a263c" text-anchor="middle">E</text></g></svg>