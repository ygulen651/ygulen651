<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-label="Fikirden tasarıma, koddan ürüne akan yolculuk"><title>Fikirden tasarıma, koddan ürüne akan yolculuk</title><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#263253"/></linearGradient><linearGradient id="floor"><stop stop-color="#638cac"/><stop offset=".5" stop-color="#e6c17b"/><stop offset="1" stop-color="#ab91c8"/></linearGradient></defs><style>
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes cruise{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,-10px)}}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(1250px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-55px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}}
@keyframes line{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes scan{0%,20%{transform:translateY(0);opacity:0}30%,70%{opacity:.6}100%{transform:translateY(135px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.08)}}
.star{animation:twinkle 5s ease-in-out infinite}.cloud{animation:drift 65s linear infinite}.ship{animation:cruise 8s ease-in-out infinite}.walker{animation:walk 38s linear infinite}.step{animation:step .65s steps(2) infinite}.ember{animation:rise 4s linear infinite}.flow{stroke-dasharray:8 18;animation:flow 9s linear infinite}.cursor{animation:blink 1.5s steps(1) infinite}.orb{animation:orb 5s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:bottom;animation:flame 1.3s steps(3) infinite}.code{transform-box:fill-box;transform-origin:left;animation:line 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.7}.scan,.ember{opacity:0}}
</style><rect x="0" y="0" width="1200" height="92" fill="#0f1529"/><text x="35" y="53" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#eed09a" text-anchor="start">Fikir</text><text x="410" y="53" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#c3cde5" text-anchor="start">Tasarım + kod</text><text x="1000" y="53" font-family="Trebuchet MS,Arial,sans-serif" font-size="23" fill="#9fcec3" text-anchor="start">Ürün</text><path d="M110 46H380M590 46H970" stroke="#41516f" stroke-width="2"/><path class="flow" d="M110 46H380M590 46H970" stroke="#d8b77c" stroke-width="3" fill="none"/></svg>