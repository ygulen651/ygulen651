<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-label="Bir fikir. Bir sonraki deneme. Çalışan bir ürün."><title>Bir fikir. Bir sonraki deneme. Çalışan bir ürün.</title><style>@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.spark{animation:glow 3s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.spark,.float{animation:none}}</style><rect x="0" y="0" width="1200" height="76" fill="#111a2b"/><text x="30" y="45" fill="#e4bf72" font-family="monospace" font-size="20" text-anchor="start">Bir fikir.</text><text x="400" y="45" fill="#c5d2e8" font-family="monospace" font-size="20" text-anchor="start">Bir sonraki deneme.</text><text x="865" y="45" fill="#90b8a8" font-family="monospace" font-size="20" text-anchor="start">Çalışan bir ürün.</text></svg>