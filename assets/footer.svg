<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Bir sonraki güzel fikre kadar. Yusuf Gülen."><title>Bir sonraki güzel fikre kadar. Yusuf Gülen.</title><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#10152f"/><stop offset="1" stop-color="#263253"/></linearGradient><linearGradient id="floor"><stop stop-color="#638cac"/><stop offset=".5" stop-color="#e6c17b"/><stop offset="1" stop-color="#ab91c8"/></linearGradient></defs><style>
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes drift{from{transform:translateX(-220px)}to{transform:translateX(1420px)}}
@keyframes cruise{0%,100%{transform:translate(0,0)}50%{transform:translate(-32px,-10px)}}
@keyframes walk{from{transform:translateX(-90px)}to{transform:translateX(1250px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.8}100%{transform:translateY(-55px);opacity:0}}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}}
@keyframes line{0%,100%{transform:scaleX(.5)}50%{transform:scaleX(1)}}
@keyframes orb{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes scan{0%,20%{transform:translateY(0);opacity:0}30%,70%{opacity:.6}100%{transform:translateY(135px);opacity:0}}
@keyframes flame{0%,100%{transform:scaleY(.85)}50%{transform:scaleY(1.08)}}
.star{animation:twinkle 5s ease-in-out infinite}.cloud{animation:drift 65s linear infinite}.ship{animation:cruise 8s ease-in-out infinite}.walker{animation:walk 38s linear infinite}.step{animation:step .65s steps(2) infinite}.ember{animation:rise 4s linear infinite}.flow{stroke-dasharray:8 18;animation:flow 9s linear infinite}.cursor{animation:blink 1.5s steps(1) infinite}.orb{animation:orb 5s ease-in-out infinite}.scan{animation:scan 7s ease-in-out infinite}.flame{transform-box:fill-box;transform-origin:bottom;animation:flame 1.3s steps(3) infinite}.code{transform-box:fill-box;transform-origin:left;animation:line 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.star{opacity:.7}.scan,.ember{opacity:0}}
</style><rect x="0" y="0" width="1200" height="120" fill="#0f1529"/><g class="star" style="animation-delay:-0s"><rect x="98" y="46" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="314" y="69" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="777" y="95" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="217" y="68" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="1040" y="87" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-5s"><rect x="59" y="75" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-6s"><rect x="905" y="83" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-7s"><rect x="782" y="89" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-8s"><rect x="1140" y="106" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-0s"><rect x="908" y="60" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="380" y="17" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="239" y="25" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="789" y="29" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="216" y="30" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-5s"><rect x="1069" y="73" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-6s"><rect x="283" y="108" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-7s"><rect x="812" y="86" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-8s"><rect x="1057" y="44" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-0s"><rect x="392" y="58" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="150" y="16" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="145" y="33" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="145" y="31" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="626" y="45" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-5s"><rect x="177" y="76" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-6s"><rect x="231" y="84" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-7s"><rect x="145" y="22" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-8s"><rect x="956" y="92" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-0s"><rect x="698" y="52" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-1s"><rect x="1103" y="95" width="3" height="3" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-2s"><rect x="918" y="31" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-3s"><rect x="278" y="20" width="2" height="2" fill="#e1dbf2"/></g><g class="star" style="animation-delay:-4s"><rect x="674" y="16" width="2" height="2" fill="#e1dbf2"/></g><text x="600" y="66" font-family="Trebuchet MS,Arial,sans-serif" font-size="25" fill="#e7cca0" text-anchor="middle">Bir sonraki güzel fikre kadar.</text><text x="600" y="95" font-family="Trebuchet MS,Arial,sans-serif" font-size="16" fill="#a4b5d1" text-anchor="middle">Yusuf Gülen / ygulen651</text><g class="cloud" style="animation-duration:22s"><rect x="0" y="24" width="80" height="2" fill="#d4c7e3"/><rect x="80" y="22" width="5" height="5" fill="#ede6d3"/></g></svg>